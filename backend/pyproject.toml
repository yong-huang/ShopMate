[project]
name = "shopmate-backend"
version = "0.1.0"
description = "ShopMate backend - FastAPI app powering the Maya shopping assistant"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "numpy>=2.5.5",
    "pydantic-settings>=2.7",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
